<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - NextGenAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">
  
  <div class="p-6">
    <div class="max-w-6xl mx-auto">
      
      <!-- Header -->
      <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center">
              <span class="text-2xl">⚙️</span>
            </div>
            <div>
              <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
              <p class="text-sm text-gray-500">NextGenAI Environment Monitor</p>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="loadEnvStatus()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
              🔄 Refresh
            </button>
            <button onclick="window.location.href='/'" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
              🏠 Home
            </button>
          </div>
        </div>
      </div>

      <!-- Info Banner -->
      <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded-lg">
        <div class="flex items-start gap-3">
          <span class="text-2xl">💡</span>
          <div class="text-sm text-blue-800">
            <strong>Info:</strong> Panel ini menampilkan status environment variables dari Vercel. 
            API keys dikelola melalui <strong>Vercel Dashboard → Settings → Environment Variables</strong>.
          </div>
        </div>
      </div>

      <!-- Main Status Container -->
      <div id="mainStatus" class="space-y-6">
        <div class="text-center text-gray-500 py-8">
          <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-2"></div>
          <p>Loading environment status...</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    // ==========================================
    // LOAD ENVIRONMENT STATUS
    // ==========================================
    
    async function loadEnvStatus() {
      const container = document.getElementById('mainStatus');
      
      try {
        container.innerHTML = `
          <div class="text-center text-gray-500 py-8">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-2"></div>
            <p>Loading environment status...</p>
          </div>
        `;

        console.log('Fetching env status...');
        
        const response = await fetch(`${API_BASE}/api/admin/env-status`);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const contentType = response.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          const text = await response.text();
          console.error('Non-JSON response:', text.substring(0, 200));
          throw new Error('Server returned non-JSON response. Check Vercel logs.');
        }
        
        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.error || 'Failed to load environment status');
        }
        
        console.log('✅ Data loaded:', data);
        renderStatus(data);
        
      } catch (error) {
        console.error('❌ Failed to load:', error);
        container.innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-lg p-6">
            <div class="flex items-start gap-3">
              <span class="text-2xl">❌</span>
              <div class="flex-1">
                <h3 class="font-bold text-red-900 mb-2">Failed to Load Environment Status</h3>
                <p class="text-sm text-red-700 mb-3">${error.message}</p>
                <div class="bg-white rounded p-3 text-xs font-mono text-gray-600 mb-3">
                  <strong>Possible causes:</strong><br>
                  • API file not deployed: <code>api/admin/env-status.js</code><br>
                  • File not deployed to Vercel yet<br>
                  • Server error - check Vercel logs<br>
                  • Network error
                </div>
                <div class="flex gap-2">
                  <button onclick="loadEnvStatus()" class="px-4 py-2 bg-blue-500 text-white rounded text-sm hover:bg-blue-600">
                    🔄 Retry
                  </button>
                  <a href="https://vercel.com/gutamas-projects-c4579180/next-gen-ai/logs" target="_blank" class="px-4 py-2 bg-gray-500 text-white rounded text-sm hover:bg-gray-600">
                    📊 Check Logs
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    // ==========================================
    // RENDER STATUS
    // ==========================================
    
    function renderStatus(data) {
      const container = document.getElementById('mainStatus');
      
      const { status, auth, aiProviders, databases, storage, deployment } = data;
      
      // Overall Status
      const statusColor = status.overall === 'healthy' ? 'green' : 'amber';
      const statusIcon = status.overall === 'healthy' ? '✅' : '⚠️';
      
      let html = `
        <!-- Overall Status -->
        <div class="bg-${statusColor}-50 border-l-4 border-${statusColor}-500 p-4 rounded-lg">
          <div class="flex items-start gap-3">
            <span class="text-2xl">${statusIcon}</span>
            <div class="flex-1">
              <h3 class="font-bold text-${statusColor}-900">System Status: ${status.overall === 'healthy' ? 'Healthy ✅' : 'Needs Attention ⚠️'}</h3>
              ${status.warnings.length > 0 ? `
                <ul class="mt-2 text-sm text-${statusColor}-700 space-y-1">
                  ${status.warnings.map(w => `<li>• ${w}</li>`).join('')}
                </ul>
              ` : '<p class="text-sm text-green-700 mt-1">All systems operational</p>'}
            </div>
          </div>
        </div>

        <!-- Quick Stats -->
        <div class="grid grid-cols-4 gap-4">
          <div class="bg-blue-50 rounded-lg p-4 text-center">
            <div class="text-3xl mb-2">${status.hasAuth ? '✅' : '❌'}</div>
            <div class="font-semibold text-blue-900">Authentication</div>
            <div class="text-xs text-blue-600 mt-1">${auth.adminEmails} admin(s)</div>
          </div>
          <div class="bg-purple-50 rounded-lg p-4 text-center">
            <div class="text-3xl mb-2">${status.hasAI ? '✅' : '❌'}</div>
            <div class="font-semibold text-purple-900">AI Providers</div>
            <div class="text-xs text-purple-600 mt-1">${Object.values(aiProviders).filter(p => p.configured).length} active</div>
          </div>
          <div class="bg-green-50 rounded-lg p-4 text-center">
            <div class="text-3xl mb-2">${status.hasStorage ? '✅' : '⚠️'}</div>
            <div class="font-semibold text-green-900">Databases</div>
            <div class="text-xs text-green-600 mt-1">${storage.total} MB total</div>
          </div>
          <div class="bg-amber-50 rounded-lg p-4 text-center">
            <div class="text-3xl mb-2">${deployment.isProduction ? '🚀' : '🔧'}</div>
            <div class="font-semibold text-amber-900">Deployment</div>
            <div class="text-xs text-amber-600 mt-1">${deployment.nodeEnv}</div>
          </div>
        </div>

        <!-- AI Providers Section -->
        <div class="bg-white rounded-lg shadow-md p-6">
          <h3 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
            🤖 AI Providers
          </h3>
          <div class="space-y-3">
            ${Object.entries(aiProviders).map(([name, provider]) => `
              <div class="flex items-center justify-between p-4 border ${provider.configured ? 'border-green-200 bg-green-50' : 'border-gray-200 bg-gray-50'} rounded-lg">
                <div class="flex items-center gap-3 flex-1">
                  <div class="w-10 h-10 rounded-lg ${provider.configured ? 'bg-green-100' : 'bg-gray-100'} flex items-center justify-center">
                    <span class="text-xl">${provider.configured ? '✅' : '❌'}</span>
                  </div>
                  <div class="flex-1">
                    <div class="font-semibold text-gray-900 capitalize flex items-center gap-2">
                      ${name}
                      ${provider.configured 
                        ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">Configured</span>' 
                        : '<span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">Not configured</span>'}
                    </div>
                    <div class="text-xs text-gray-500 mt-1">${provider.models.join(', ')}</div>
                    ${provider.key ? `
                      <div class="text-xs font-mono text-gray-600 bg-white px-2 py-1 rounded mt-1 inline-block">
                        ${provider.key}
                      </div>
                    ` : ''}
                  </div>
                </div>
                ${provider.configured ? `
                  <button 
                    onclick="testAPIKey('${name}')" 
                    id="test-btn-${name}"
                    class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm flex items-center gap-2 transition-all shadow-sm hover:shadow-md"
                  >
                    <span>🧪</span> Test API
                  </button>
                ` : `
                  <a 
                    href="https://vercel.com/gutamas-projects-c4579180/next-gen-ai/settings/environment-variables" 
                    target="_blank"
                    class="px-4 py-2 bg-amber-500 text-white rounded-lg hover:bg-amber-600 text-sm"
                  >
                    Add Key
                  </a>
                `}
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Database Section -->
        <div class="bg-white rounded-lg shadow-md p-6">
          <h3 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
            💾 Database Configuration
          </h3>
          
          <!-- Storage Summary -->
          <div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg p-4 mb-4">
            <div class="text-center">
              <div class="text-3xl font-bold text-purple-600">${storage.total} MB</div>
              <div class="text-sm text-gray-600">Total Free Storage Available</div>
              <div class="text-xs text-gray-500 mt-2">
                MongoDB: ${storage.mongodb.total} MB • 
                Supabase: ${storage.supabase.total} MB • 
                Vercel KV: ${storage.vercelKV.capacity} MB
              </div>
            </div>
          </div>

          ${databases.mongodb.length > 0 ? `
            <div class="mb-4">
              <h4 class="font-semibold text-gray-800 mb-2">📦 MongoDB (${databases.mongodb.length}/10)</h4>
              <div class="space-y-2">
                ${databases.mongodb.map(db => `
                  <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg text-sm">
                    <div class="flex items-center gap-2">
                      <span class="text-green-500">✓</span>
                      <span class="font-semibold">${db.name}</span>
                      <span class="text-gray-500">→</span>
                      <span class="text-gray-600">${db.database}</span>
                    </div>
                    <span class="text-xs font-mono text-gray-500">${db.uri}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : '<div class="text-sm text-gray-500 mb-4 p-3 bg-gray-50 rounded-lg">No MongoDB configured</div>'}

          ${databases.supabase.length > 0 ? `
            <div class="mb-4">
              <h4 class="font-semibold text-gray-800 mb-2">🗄️ Supabase (${databases.supabase.length}/5)</h4>
              <div class="space-y-2">
                ${databases.supabase.map(db => `
                  <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg text-sm">
                    <div class="flex items-center gap-2">
                      <span class="text-green-500">✓</span>
                      <span class="font-semibold">${db.name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs text-gray-500">${db.url}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : '<div class="text-sm text-gray-500 mb-4 p-3 bg-gray-50 rounded-lg">No Supabase configured</div>'}

          <div>
            <h4 class="font-semibold text-gray-800 mb-2">⚡ Vercel KV</h4>
            <div class="p-3 bg-gray-50 rounded-lg text-sm">
              ${databases.vercelKV.configured ? `
                <div class="flex items-center gap-2">
                  <span class="text-green-500">✓</span>
                  <span class="font-semibold">Configured (${storage.vercelKV.capacity} MB)</span>
                </div>
              ` : '<span class="text-gray-500">Not configured</span>'}
            </div>
          </div>
        </div>

        <!-- Deployment Info -->
        ${deployment.vercelUrl ? `
          <div class="bg-white rounded-lg shadow-md p-6">
            <h3 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
              🚀 Deployment Info
            </h3>
            <div class="space-y-2 text-sm">
              <div class="flex justify-between p-2 bg-gray-50 rounded">
                <span class="text-gray-600">Vercel URL:</span>
                <a href="https://${deployment.vercelUrl}" target="_blank" class="text-blue-600 hover:underline font-mono">${deployment.vercelUrl}</a>
              </div>
              <div class="flex justify-between p-2 bg-gray-50 rounded">
                <span class="text-gray-600">Environment:</span>
                <span class="font-mono font-semibold ${deployment.isProduction ? 'text-green-600' : 'text-amber-600'}">${deployment.nodeEnv}</span>
              </div>
            </div>
          </div>
        ` : ''}
      `;
      
      container.innerHTML = html;
    }

    // ==========================================
    // TEST API KEY
    // ==========================================
    
    async function testAPIKey(provider) {
      const btn = document.getElementById(`test-btn-${provider}`);
      const originalHTML = btn.innerHTML;
      
      btn.innerHTML = '<span class="animate-spin inline-block">⏳</span> Testing...';
      btn.disabled = true;

      try {
        console.log(`Testing ${provider}...`);
        
        const response = await fetch(`${API_BASE}/api/admin/env-status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider })
        });

        const result = await response.json();
        console.log('Test result:', result);

        if (result.success) {
          btn.innerHTML = '<span>✅</span> Working!';
          btn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
          btn.classList.add('bg-green-500', 'hover:bg-green-600');
          
          alert(`✅ ${provider.toUpperCase()} API Test Success!\n\n${result.message}\n\nModel: ${result.model}`);
        } else {
          btn.innerHTML = '<span>❌</span> Failed';
          btn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
          btn.classList.add('bg-red-500', 'hover:bg-red-600');
          
          alert(`❌ ${provider.toUpperCase()} API Test Failed!\n\nError: ${result.error}\n\nPlease check:\n1. API key is correct\n2. API has sufficient credits\n3. Network connectivity`);
        }

        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.disabled = false;
          btn.classList.remove('bg-green-500', 'hover:bg-green-600', 'bg-red-500', 'hover:bg-red-600');
          btn.classList.add('bg-blue-500', 'hover:bg-blue-600');
        }, 3000);

      } catch (error) {
        console.error('Test error:', error);
        btn.innerHTML = '<span>❌</span> Error';
        btn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
        btn.classList.add('bg-red-500', 'hover:bg-red-600');
        
        alert(`❌ Test Error!\n\n${error.message}`);

        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.disabled = false;
          btn.classList.remove('bg-red-500', 'hover:bg-red-600');
          btn.classList.add('bg-blue-500', 'hover:bg-blue-600');
        }, 3000);
      }
    }

    // ==========================================
    // INITIALIZATION
    // ==========================================
    
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 Admin panel loaded');
      loadEnvStatus();
    });
  </script>

</body>
</html>
