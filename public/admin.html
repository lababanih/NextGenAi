<!-- Replace the AI Providers section in your admin.html with this -->

<div class="bg-gray-50 rounded-lg p-4">
  <h3 class="font-bold text-gray-900 mb-3 flex items-center gap-2">
    🤖 AI Providers
  </h3>
  <div class="space-y-3" id="aiProvidersContainer">
    <div class="text-center text-gray-500 py-4">Loading...</div>
  </div>
</div>

<script>
// Function to render AI providers with test buttons
function renderAIProviders(aiProviders) {
  const container = document.getElementById('aiProvidersContainer');
  
  if (!aiProviders) {
    container.innerHTML = '<div class="text-red-500">Failed to load AI providers</div>';
    return;
  }

  const providersHTML = Object.entries(aiProviders).map(([name, provider]) => {
    const isConfigured = provider.configured;
    const statusColor = isConfigured ? 'green' : 'gray';
    const statusIcon = isConfigured ? '✅' : '❌';

    return `
      <div class="flex items-center justify-between p-3 bg-white rounded-lg border ${isConfigured ? 'border-green-200' : 'border-gray-200'}">
        <div class="flex items-center gap-3 flex-1">
          <div class="w-10 h-10 rounded-lg bg-${statusColor}-100 flex items-center justify-center">
            <span class="text-xl">${statusIcon}</span>
          </div>
          <div class="flex-1">
            <div class="font-semibold text-gray-900 capitalize flex items-center gap-2">
              ${name}
              ${isConfigured ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">Configured</span>' : '<span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">Not configured</span>'}
            </div>
            <div class="text-xs text-gray-500">${provider.models.join(', ')}</div>
            ${provider.key ? `
              <div class="text-xs font-mono text-gray-600 bg-gray-100 px-2 py-1 rounded mt-1 inline-block">
                ${provider.key}
              </div>
            ` : ''}
            ${provider.tested ? `
              <div class="text-xs mt-1 ${provider.status === 'working' ? 'text-green-600' : 'text-red-600'}">
                Test result: ${provider.status === 'working' ? '✅ Working!' : '❌ Failed'}
              </div>
            ` : ''}
          </div>
        </div>
        ${isConfigured ? `
          <button 
            onclick="testAPIKey('${name}')" 
            id="test-btn-${name}"
            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm flex items-center gap-2 transition-all"
          >
            <span>🧪</span> Test
          </button>
        ` : `
          <a 
            href="https://vercel.com/gutamas-projects-c4579180/next-gen-ai/settings/environment-variables" 
            target="_blank"
            class="px-4 py-2 bg-amber-500 text-white rounded-lg hover:bg-amber-600 text-sm"
          >
            Add API Key
          </a>
        `}
      </div>
    `;
  }).join('');

  container.innerHTML = providersHTML;
}

// Function to test API key
async function testAPIKey(provider) {
  const btn = document.getElementById(`test-btn-${provider}`);
  const originalHTML = btn.innerHTML;
  
  // Show loading
  btn.innerHTML = '<span class="animate-spin inline-block">⏳</span> Testing...';
  btn.disabled = true;

  try {
    const response = await fetch(`${API_BASE}/api/admin/env-status`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ provider })
    });

    const result = await response.json();

    if (result.success) {
      // Show success
      btn.innerHTML = '<span>✅</span> Working!';
      btn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
      btn.classList.add('bg-green-500', 'hover:bg-green-600');
      
      alert(`✅ ${provider.toUpperCase()} API Test Success!\n\n${result.message}\n\nModel: ${result.model}`);
    } else {
      // Show error
      btn.innerHTML = '<span>❌</span> Failed';
      btn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
      btn.classList.add('bg-red-500', 'hover:bg-red-600');
      
      alert(`❌ ${provider.toUpperCase()} API Test Failed!\n\nError: ${result.error}\n\nPlease check:\n1. API key is correct\n2. API key has sufficient credits\n3. API endpoint is accessible`);
    }

    // Reset button after 3 seconds
    setTimeout(() => {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
      btn.classList.remove('bg-green-500', 'hover:bg-green-600', 'bg-red-500', 'hover:bg-red-600');
      btn.classList.add('bg-blue-500', 'hover:bg-blue-600');
    }, 3000);

  } catch (error) {
    console.error('Test error:', error);
    btn.innerHTML = '<span>❌</span> Error';
    btn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
    btn.classList.add('bg-red-500', 'hover:bg-red-600');
    
    alert(`❌ Test Error!\n\n${error.message}`);

    setTimeout(() => {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
      btn.classList.remove('bg-red-500', 'hover:bg-red-600');
      btn.classList.add('bg-blue-500', 'hover:bg-blue-600');
    }, 3000);
  }
}

// Update the loadEnvStatus function to call renderAIProviders
async function loadEnvStatus() {
  const container = document.getElementById('envStatus');
  
  try {
    container.innerHTML = `
      <div class="text-center text-gray-500 py-8">
        <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-2"></div>
        <p>Loading environment status...</p>
      </div>
    `;

    const apiUrl = `${API_BASE}/api/admin/env-status`;
    console.log('Fetching env status from:', apiUrl);
    
    const response = await fetch(apiUrl);
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const contentType = response.headers.get('content-type');
    if (!contentType || !contentType.includes('application/json')) {
      const text = await response.text();
      console.error('Non-JSON response:', text.substring(0, 200));
      throw new Error('Server returned non-JSON response');
    }
    
    const data = await response.json();
    
    if (!data.success) {
      throw new Error(data.error || 'Failed to load environment status');
    }
    
    // Render the full status (existing renderEnvStatus function)
    renderEnvStatus(data);
    
    // Also render AI providers section separately
    renderAIProviders(data.aiProviders);
    
  } catch (error) {
    console.error('Failed to load env status:', error);
    container.innerHTML = `
      <div class="bg-red-50 border border-red-200 rounded-lg p-4">
        <div class="flex items-start gap-3">
          <span class="text-2xl">❌</span>
          <div class="flex-1">
            <h3 class="font-bold text-red-900 mb-2">Failed to Load Environment Status</h3>
            <p class="text-sm text-red-700 mb-3">${error.message}</p>
            <button onclick="loadEnvStatus()" class="px-3 py-2 bg-blue-500 text-white rounded text-sm hover:bg-blue-600">
              🔄 Retry
            </button>
          </div>
        </div>
      </div>
    `;
  }
}
</script>
